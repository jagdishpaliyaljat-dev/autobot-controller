name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    - name: Generate or Ensure Permanent Keystore
      run: |
        mkdir -p keystore
        if [ ! -f keystore/release.jks ]; then
          keytool -genkeypair -v \
            -keystore keystore/release.jks \
            -alias autobot_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 20000 \
            -storepass autobot_secret_key_pass \
            -keypass autobot_secret_key_pass \
            -dname "CN=AutoBot, OU=Personal, O=Personal, L=India, ST=India, C=IN"
        fi

    - name: Build Signed APK
      run: gradle assembleRelease --stacktrace

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoBot-Signed-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v3.1.0
        name: AutoBot Controller v3.1.0 (Fixed Signing Key)
        body: "Permanent Keystore Build: Allows seamless in-place updates without uninstalling or losing data."
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
